
name: Build Fahmi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Extract Android project
        run: |
          unzip -o FahmiScreenRecorder-source-with-build-workflow.zip -d project
          test -f project/FahmiBuildProject/settings.gradle.kts

      - name: Build debug APK
        working-directory: project/FahmiBuildProject
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fahmi-ScreenRecorder-debug-apk
          path: project/FahmiBuildProject/app/build/outputs/apk/debug/app-debug.apk
          
