
name: Build Fahmi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          unzip -o FahmiScreenRecorder-source-with-build-workflow.zip -d project
          test -f project/FahmiBuildProject/settings.gradle.kts

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: project/FahmiBuildProject
        run: |
          gradle --version
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fahmi-ScreenRecorder-debug-apk
          path: project/FahmiBuildProject/app/build/outputs/apk/debug/app-debug.apk
          
